name: Auto-merge congress-trading-shared PRs

# Same elevated-token rule as auto-merge-prs.yml -- read its header for the full
# reasoning and receipts. Short version: arming auto-merge under GITHUB_TOKEN
# makes github-actions[bot] the merging identity, and GitHub raises no workflow
# events for GITHUB_TOKEN actions, so the merge commit on main runs neither CI
# nor ios-ship. Without a GH_PAT / SHEPHERD_TOKEN secret this workflow no-ops.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check if PR updates congress-trading-shared
        id: check
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          IS_SHARED=false
          if [[ "$HEAD_REF" =~ (dependabot|congress-trading-shared|shared-package|bump-congress|antigravity/bump) ]]; then
            IS_SHARED=true
          elif [[ "$TITLE" =~ (congress-trading-shared|shared-package|@jaywedgeworth22/congress-trading-shared) ]]; then
            IS_SHARED=true
          fi
          echo "is_shared=$IS_SHARED" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.check.outputs.is_shared == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.SHEPHERD_TOKEN }}
          HAS_PAT: ${{ (secrets.GH_PAT != '' || secrets.SHEPHERD_TOKEN != '') && '1' || '0' }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ "$HAS_PAT" != "1" ]; then
            echo "No GH_PAT / SHEPHERD_TOKEN secret; not arming auto-merge (see workflow header)."
            echo "::notice::shared-dependency auto-merge not armed: no elevated token"
            exit 0
          fi
          echo "Enabling auto-merge for $PR_URL"
          gh pr merge --auto --squash "$PR_URL" || echo "Auto-merge already set or failed."
