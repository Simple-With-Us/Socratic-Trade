name: Auto-merge PRs

# Thin caller for the fleet's shared auto-merge armer
# (AI-Fleet-Coordinator/.github/workflows/auto-merge-reusable.yml, docs in
# AFC docs/AUTO-MERGE.md).  Repo policy lives in the inputs below.
#
# ST keeps its money-path gate: PRs touching CODEOWNERS trading-execution
# paths are not armed - a human merges after review (board bdc2b662 /
# 318bfe710b794c28 / ST-3326).  Hold labels `do-not-automerge` /
# `needs-human-merge` block arming and disable any armed merge.
#
# The merge token resolves GH_PAT, then SHEPHERD_TOKEN.  Arming never falls
# back to GITHUB_TOKEN (a bot-attributed merge dispatches no workflow events -
# no CI, no ios-ship on main), and the reusable probes the token before use,
# so a dead credential fails loud instead of 401ing mid-step (ST-4393).
#
# Branch deletion is off, because the merge queue is on (repo ruleset
# 17945518).  GitHub refuses `--delete-branch` when a queue is enabled
# ("Cannot use -d or --delete-branch when merge queue enabled"), so asking
# for it made the arm step exit 1 on every PR in this repo.  The queue's own
# "delete head branches" setting owns that job (ST-4566).

# Money-path globs the CODEOWNERS gate protects (kept in lockstep with
# .github/CODEOWNERS by test/automerge-gate-dry-run.test.ts):
# BEGIN MONEY_PATH_GLOBS
# /src/lib/broker.ts
# /src/lib/broker-*.ts
# /src/lib/public-broker.ts
# /src/lib/alpaca.ts
# /src/lib/alpaca-*.ts
# /src/lib/tradier.ts
# /src/lib/robinhood.ts
# /src/lib/etoro.ts
# /src/lib/etoro-*.ts
# /src/lib/webull.ts
# /src/lib/kalshi.ts
# /src/lib/kalshi-*.ts
# /src/lib/order-*.ts
# /src/lib/option-orders.ts
# /src/lib/stale-limit-orders.ts
# /src/lib/proposal-*.ts
# /src/lib/execution*
# /src/lib/db-execution.ts
# /src/lib/db-proposals.ts
# /src/lib/strategy-execution.ts
# /src/lib/strategy-run-execution-registry.ts
# /src/lib/trading-liveness.ts
# /src/lib/tradingview-trigger.ts
# /src/lib/scheduler.ts
# /app/api/orders/
# /app/api/proposals/
# END MONEY_PATH_GLOBS

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

# checks/actions/issues reads feed the reusable's in-flight gate (a called
# workflow's GITHUB_TOKEN is capped by the caller's grants, and a called
# workflow requesting scopes the caller omits fails at startup).
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  issues: read

jobs:
  auto-merge:
    uses: Simple-With-Us/AI-Fleet-Coordinator/.github/workflows/auto-merge-reusable.yml@3dcf85a81cadd7f8f977827858ded8f5439856a9
    with:
      use_wise_relay: true
      expected_merge_actor: swu-wise[bot]
      require_codeowners_gate: true
      gate_script: scripts/pr-touches-codeowners-paths.sh
      self_guard_paths: .github/CODEOWNERS,.github/workflows/auto-merge-prs.yml,scripts/pr-touches-codeowners-paths.sh,scripts/automerge-gate-dry-run.sh,scripts/disable-pr-automerge.sh
      delete_branch: false
    secrets:
      wise_infisical_token: ${{ secrets.WISE_RELAY_INFISICAL_TOKEN }}
