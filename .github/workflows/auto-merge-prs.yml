name: Auto-merge PRs

# Arm GitHub auto-merge on non-draft, same-repo PRs that do NOT touch
# CODEOWNERS trading-execution paths (.github/CODEOWNERS).  Live-money diffs
# require a human merge (owner review gate; board bdc2b662 / 318bfe710b794c28).
# Hold labels: `do-not-automerge` or `needs-human-merge` skip arming and disable
# any already-armed merge.
#
# ---------------------------------------------------------------------------
# WHY THIS WORKFLOW REFUSES TO ARM WITHOUT AN ELEVATED TOKEN (2026-08-13)
# ---------------------------------------------------------------------------
# GitHub does not raise workflow events for anything done with the repository's
# GITHUB_TOKEN (documented recursion guard; only workflow_dispatch and
# repository_dispatch are exempt). This workflow arms auto-merge, so GitHub
# attributes the eventual merge to the arming actor. Armed under GITHUB_TOKEN
# that actor is github-actions[bot], and the resulting push to main dispatches
# NOTHING -- not CI, not ios-ship, not effort-issues-sync.
#
# Receipts (2026-08-13): PR #2675 merged by github-actions[bot], merge sha
# ca38bb29797d46b68d9dd6a92006cdfb9c9cb20b -> `gh api
# repos/<r>/actions/runs?head_sha=<sha>` returns 27 runs of which ZERO are
# `event: push` (all workflow_run/schedule/workflow_dispatch). PRs #2678/#2679/
# #2680, merged by jaywedgeworth22, get the full push-triggered run set.
#
# The comment this replaces already said "prefer GH_PAT / SHEPHERD_TOKEN", but
# `gh api repos/<r>/actions/secrets` shows NEITHER exists (and the account is a
# user, not an org, so there is no org secret scope). The `||` fallback chain
# therefore resolved to GITHUB_TOKEN on every run and the preference was purely
# decorative. So: when no elevated token is present this workflow now no-ops
# loudly instead of arming a merge that silently strands main unverified.
#
# With arming off, PRs land the way AGENTS.md already mandates -- the landing
# agent's own `bash scripts/land.sh` ends in `gh pr merge --auto --squash` under
# the owner's gh credentials, so merged_by is a human identity and every
# push-triggered workflow fires. Failure mode if an agent forgets: the PR sits
# open on the PR list (loud, one command to fix), instead of today's silent
# unverified merge.
#
# Re-activation is zero-code: add a GH_PAT or SHEPHERD_TOKEN repo secret
# (fine-grained PAT or GitHub App installation token, contents + pull_requests
# write) and this workflow arms again automatically. Minting that credential is
# an OWNER action -- agents never create tokens.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  classify-protected:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      touches_protected: ${{ steps.check.outputs.touches_protected }}
      skip_automerge: ${{ steps.check.outputs.skip_automerge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect CODEOWNERS trading paths in PR diff
        id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          skip_automerge=false
          # Read CODEOWNERS from the base revision so this PR cannot relax its own gate.
          BASE_CODEOWNERS="$RUNNER_TEMP/codeowners-base"
          git show "$BASE:.github/CODEOWNERS" > "$BASE_CODEOWNERS" 2>/dev/null || : > "$BASE_CODEOWNERS"
          if CODEOWNERS_FILE="$BASE_CODEOWNERS" bash scripts/pr-touches-codeowners-paths.sh "$BASE" "$HEAD"; then
            echo "touches_protected=true" >> "$GITHUB_OUTPUT"
            skip_automerge=true
            echo "::notice::PR touches CODEOWNERS trading-execution paths - auto-merge will not be armed (human merge required)"
          else
            echo "touches_protected=false" >> "$GITHUB_OUTPUT"
          fi
          merge_base="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || true)"
          if [ -n "$merge_base" ]; then
            changed_files="$(git diff --name-only --no-renames "$merge_base" "$HEAD" 2>/dev/null || true)"
          else
            changed_files=""
          fi
          if printf '%s\n' "$changed_files" | grep -qxE '(\.github/CODEOWNERS|\.github/workflows/auto-merge-prs\.yml|scripts/pr-touches-codeowners-paths\.sh)'; then
            skip_automerge=true
            echo "::notice::PR edits the auto-merge gate - auto-merge will not be armed on this PR"
          fi
          if [ "$skip_automerge" = true ]; then
            echo "skip_automerge=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_automerge=false" >> "$GITHUB_OUTPUT"
          fi

  # When the hold label is present (including mid-flight labeled events),
  # cancel any already-armed auto-merge so production cannot land against intent.
  disable-on-hold:
    runs-on: ubuntu-latest
    if: >
      contains(github.event.pull_request.labels.*.name, 'do-not-automerge') ||
      contains(github.event.pull_request.labels.*.name, 'needs-human-merge')
    steps:
      - name: Disable auto-merge (hold label)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.SHEPHERD_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          echo "Hold label present; disabling auto-merge for $PR_URL"
          gh pr merge --disable-auto "$PR_URL" || {
            echo "disable-auto returned nonzero (already off or not armed); continuing"
            exit 0
          }

  disable-on-skip-automerge:
    runs-on: ubuntu-latest
    needs: classify-protected
    if: >
      needs.classify-protected.outputs.skip_automerge == 'true'
    steps:
      - name: Disable auto-merge (ineligible PR)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.SHEPHERD_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          echo "PR is ineligible for workflow auto-merge; disabling for $PR_URL"
          gh pr merge --disable-auto "$PR_URL" || {
            echo "disable-auto returned nonzero (already off or not armed); continuing"
            exit 0
          }

  disable-on-protected:
    runs-on: ubuntu-latest
    needs: classify-protected
    if: >
      needs.classify-protected.outputs.touches_protected == 'true'
    steps:
      - name: Disable auto-merge (CODEOWNERS paths)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.SHEPHERD_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          echo "PR touches CODEOWNERS trading paths; disabling auto-merge for $PR_URL"
          gh pr merge --disable-auto "$PR_URL" || {
            echo "disable-auto returned nonzero (already off or not armed); continuing"
            exit 0
          }

  auto-merge:
    runs-on: ubuntu-latest
    needs: classify-protected
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-automerge') &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human-merge') &&
      needs.classify-protected.outputs.skip_automerge != 'true'
    steps:
      # Fail-safe, not fail-open: without an elevated token this workflow would
      # arm a merge that GitHub attributes to github-actions[bot], and that
      # merge commit dispatches no workflow events at all. Stop here instead.
      - name: Require an elevated token before arming auto-merge
        id: token-gate
        env:
          HAS_PAT: ${{ (secrets.GH_PAT != '' || secrets.SHEPHERD_TOKEN != '') && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$HAS_PAT" != "1" ]; then
            echo "No GH_PAT / SHEPHERD_TOKEN secret is configured."
            echo "Arming auto-merge with GITHUB_TOKEN would make github-actions[bot] the"
            echo "merging identity, and GitHub raises no workflow events for GITHUB_TOKEN"
            echo "actions -- the merge commit on main would run neither CI nor ios-ship."
            echo "Skipping (no-op). Land this PR with 'gh pr merge <n> --squash --auto'"
            echo "under your own gh credentials; scripts/land.sh already does exactly that."
            echo "::notice::auto-merge not armed: no GH_PAT/SHEPHERD_TOKEN secret (see workflow header)"
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Elevated token present -- arming auto-merge."
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge (squash + delete branch)
        if: steps.token-gate.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.SHEPHERD_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          echo "Enabling auto-merge (squash) for $PR_URL"
          # Squash only -- do not fall back to merge commits (fleet policy + cleaner history).
          # Treat "already enabled" as success; do not fail the workflow when arming is blocked.
          out="$(gh pr merge --auto --squash --delete-branch "$PR_URL" 2>&1)" && {
            echo "$out"
            exit 0
          }
          echo "$out"
          if echo "$out" | grep -qiE 'already enabled|Pull request is in clean status|Auto merge is already'; then
            echo "Auto-merge already armed."
            exit 0
          fi
          # Pending checks, merge conflicts, or review-required refusals (non-fatal).
          if echo "$out" | grep -qiE 'is not mergeable|not mergeable|merge conflict|required status check|Review required'; then
            if gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest' | grep -vq null; then
              echo "Auto-merge armed despite pending checks."
              exit 0
            fi
            echo "::notice::Auto-merge not armed ($(echo "$out" | head -1))"
            exit 0
          fi
          echo "::error::Failed to enable squash auto-merge for $PR_URL"
          echo "$out"
          exit 1
