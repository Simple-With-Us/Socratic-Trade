name: Auto-merge PRs

# Thin caller for the fleet's shared auto-merge armer
# (AI-Fleet-Coordinator/.github/workflows/auto-merge-reusable.yml, docs in
# AFC docs/AUTO-MERGE.md).  Repo policy lives in the inputs below.
#
# ST keeps its money-path gate: PRs touching CODEOWNERS trading-execution
# paths are not armed - a human merges after review (board bdc2b662 /
# 318bfe710b794c28 / ST-3326).  Hold labels `do-not-automerge` /
# `needs-human-merge` block arming and disable any armed merge.
#
# The merge token resolves GH_PAT, then SHEPHERD_TOKEN.  Arming never falls
# back to GITHUB_TOKEN (a bot-attributed merge dispatches no workflow events -
# no CI, no ios-ship on main), and the reusable probes the token before use,
# so a dead credential fails loud instead of 401ing mid-step (ST-4393).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: Simple-With-Us/AI-Fleet-Coordinator/.github/workflows/auto-merge-reusable.yml@0a17292d8490f80ac237bd7dc26998ee3776e498
    with:
      require_codeowners_gate: true
      gate_script: scripts/pr-touches-codeowners-paths.sh
      self_guard_paths: .github/CODEOWNERS,.github/workflows/auto-merge-prs.yml,scripts/pr-touches-codeowners-paths.sh,scripts/automerge-gate-dry-run.sh,scripts/disable-pr-automerge.sh
    secrets:
      merge_token: ${{ secrets.GH_PAT || secrets.SHEPHERD_TOKEN }}
