name: Playwright Smoke

# Playwright Smoke — NOT a required merge check (ruleset: verify only). PR trigger removed
# 2026-07-21 to unclog the self-hosted runner queue; still runs on main / nightly / manual.

on:
  # smoke is NOT a required status check (ruleset requires only `verify`). Running it on
  # every PR clogged the single socratic-ci pool (~35% of backlog was smoke). PR coverage
  # removed 2026-07-21; smoke remains on main push, nightly schedule, and workflow_dispatch.
  push:
    branches:
      - main
  schedule:
    # Nightly full-browser baseline now that smoke no longer runs on every PR.
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    # Cheap gate-shape job: is this diff documentation-only? Only `pull_request` gets
    # the fast path — push/merge_group/schedule always run the full smoke suite.
    # Reject fork PRs before fork-controlled repository content reaches the persistent
    # self-hosted workspace.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # Classify only needs the two endpoint trees. Full-history fetches can
          # monopolize the single self-hosted runner before this cheap gate runs.
          fetch-depth: 1
          fetch-tags: false
          ref: ${{ github.sha }}
      - name: Determine whether the diff is documentation-only
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event (${{ github.event_name }}) — running full smoke."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Missing base/head SHA — running full smoke to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$base" "$head"; then
            echo "Could not fetch base/head endpoint commits — running full smoke to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames is load-bearing (see ci.yml): with rename detection active,
          # `git mv src/foo.ts docs/foo.md` would list only docs/foo.md and misclassify
          # as docs-only while code was removed. --no-renames splits renames so BOTH
          # the deleted source and the added doc get classified.
          changed_files="$(git diff --name-only --no-renames "$base" "$head" 2>/dev/null || true)"
          if [ -z "$changed_files" ]; then
            echo "Could not compute a changed-files list — running full smoke to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$changed_files"
          non_docs="$(printf '%s\n' "$changed_files" | grep -Ev '(^|/)[^/]+\.md$|^docs/' || true)"
          # docs/benchmarks/* is bundled at build time (app/api/llm-usage/model-stats/route.ts) — not
          # safe to skip smoke when only those JSON files change.
          benchmarks_changed="$(printf '%s\n' "$changed_files" | grep -E '^docs/benchmarks/' || true)"
          if [ -n "$benchmarks_changed" ]; then
            non_docs="$(printf '%s\n%s' "$non_docs" "$benchmarks_changed" | sed '/^$/d' | sort -u)"
          fi
          if [ -z "$non_docs" ]; then
            echo "All changed files are documentation-class (*.md or docs/**, excluding build-imported docs/benchmarks/) — docs-only fast path applies."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-documentation files changed — running full smoke:"
            echo "$non_docs"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: classify
    # `!cancelled()` (not always(), which would also run on cancelled/superseded runs
    # and defeat the concurrency cancel-in-progress above) so smoke still RUNS when
    # classify fails — a skipped required check can fail open. The first step then
    # fails smoke closed explicitly.
    if: ${{ !cancelled() }}
    # 2026-07-18: GitHub-hosted `ubuntu-latest` is not assigning runners for this repo
    # (runner_id=0/no step logs), so required smoke runs on the online Coolify Hetzner CI runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Leave headroom below the Coolify runner's 3 GiB hard cap for Chromium,
      # Next build workers, and the webServer process; 2560 MiB allowed the
      # webServer to be OOM-killed with exit 137 on the admin PR.
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Fail closed if classify did not succeed
        if: needs.classify.result != 'success'
        run: |
          echo "::error::classify job did not succeed (result: ${{ needs.classify.result }}) — failing smoke closed; the docs-only fast path never fails open."
          exit 1
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run this job."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]'|'sentry[bot]'|'codex[bot]'|'chatgpt-codex-connector[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Bot PRs cannot run this job (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - name: Docs-only short-circuit
        if: needs.classify.outputs.docs-only == 'true'
        run: echo "docs-only diff — smoke skipped by path filter"
      - uses: actions/checkout@v7
        if: needs.classify.outputs.docs-only != 'true'
      - uses: actions/setup-node@v7
        if: needs.classify.outputs.docs-only != 'true'
        with:
          node-version: 24
      # Long-lived socratic-ci workspaces have lost the tree between checkout and
      # npm install when a concurrent job's clean step overlapped (ENOENT package.json
      # on the 2026-07-26 scheduled smoke). Same re-checkout boundary as ci.yml
      # verify-hosted: scrub, re-checkout, then install.
      - name: Disable lingering sparse-checkout
        if: needs.classify.outputs.docs-only != 'true'
        run: rm -rf ./* ./.git || true
      - name: Refresh checkout before package operations
        if: needs.classify.outputs.docs-only != 'true'
        uses: actions/checkout@v7
      - name: Assert package.json present
        if: needs.classify.outputs.docs-only != 'true'
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::error::package.json missing after refresh checkout — refusing to run npm ci on an empty workspace."
            ls -la
            exit 1
          fi
      - name: Install dependencies
        if: needs.classify.outputs.docs-only != 'true'
        run: npm ci --no-audit
      # Cache the Playwright browser download (chromium, ~130MB) keyed on the lockfile
      # (which pins the playwright version). On a hit, the install step below skips the
      # multi-minute download and only re-applies system deps.
      - name: Cache Playwright browsers
        if: needs.classify.outputs.docs-only != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser
        if: needs.classify.outputs.docs-only != 'true'
        shell: bash
        run: |
          # GitHub-hosted ubuntu-latest: install Chromium and WebKit + OS deps.
          npx playwright install --with-deps chromium webkit
      # Restore Next.js's incremental build cache so the playwright webServer's
      # `npm run build` reuses prior compilation output instead of a cold build.
      - name: Restore Next.js build cache
        if: needs.classify.outputs.docs-only != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-
            ${{ runner.os }}-nextjs-
      - name: Run smoke tests
        if: needs.classify.outputs.docs-only != 'true'
        run: npm run test:e2e
