name: Deploy

# Deploys the merged `main` branch to the self-hosted production host.
# Production runs `next start` under PM2 (app `trading`) from the
# `~/apps/trading-live` worktree, served at trading.jays.services.
# Activation + self-hosted-runner setup notes live in ci-pending/README.md.

on:
  # Auto-deploy every push to main (i.e. every merged PR).
  push:
    branches: [main]
  # Manual "Run workflow" button in the Actions tab.
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancel it mid-build/restart.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Requires a self-hosted runner registered on the production box and carrying
    # BOTH of these labels. See ci-pending/README.md → "Self-hosted runner setup".
    runs-on: [self-hosted, trading-live]

    # Read access to repo contents is enough to fetch the code.
    permissions:
      contents: read
      packages: read

    # Optional overrides via repo Settings → Secrets and variables → Variables.
    # Defaults match the documented production layout; resolved with shell
    # fallbacks below so an unset variable still works.
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      PM2_APP: ${{ vars.PM2_APP }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Pull, build, and restart production
        shell: bash
        run: |
          set -euo pipefail
          DIR="${DEPLOY_DIR:-$HOME/apps/trading-live}"
          APP="${PM2_APP:-trading}"

          # The Infisical bootstrap (written by scripts/infisical-prod-cutover.sh; chmod
          # 600, never committed, lives outside the repo) holds the long-lived
          # machine-identity Client ID/Secret. It is sourced ONLY inside the build and
          # restart steps below — never around `npm ci`, so the credential is not exposed
          # to dependency install/lifecycle scripts. Absent → plain build/restart.
          ENV_FILE="$HOME/.config/agentic-trading/deploy.env"

          echo "::group::Update worktree ($DIR -> origin/main)"
          cd "$DIR"
          # The launchd runner has no stored git credentials / no TTY, so the
          # repo's HTTPS remote can't authenticate on its own. Fetch with the
          # job's GITHUB_TOKEN (auto-masked in logs).
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          # trading-live is a LINKED worktree sharing the clone with the main
          # integration worktree (which has `main` checked out), so we can't
          # check out `main` here. Hard-reset this worktree's working tree to the
          # fetched commit instead — no branch switch. Untracked files
          # (.env.local, data/app.db, data/logos/) are left untouched.
          git reset --hard FETCH_HEAD
          git --no-pager log --oneline -1
          echo "::endgroup::"

          echo "::group::Install dependencies (lockfile-exact)"
          npm ci
          # Fetch auth is only needed for the git fetch above. Unset it before
          # build/restart so PM2 cannot propagate workflow credentials.
          unset GH_TOKEN
          echo "::endgroup::"

          echo "::group::Build (.next is regenerated)"
          # Source the bootstrap in a SUBSHELL scoped to this step. deploy.env is the
          # cutover signal (it carries REQUIRE_SECRETS_MANAGER=1), so when it is present the
          # secrets path MUST work: a present-but-unusable bootstrap (missing CLI or no
          # complete credential) is a HARD deploy failure, never a silent plain build — that
          # would go on to restart a `start:secrets` service that then refuses to boot.
          # Plain build happens only pre-cutover, when no bootstrap exists.
          if [ -f "$ENV_FILE" ]; then
            ( set -a; . "$ENV_FILE"; set +a
              command -v infisical >/dev/null 2>&1 \
                || { echo "[deploy] ERROR: $ENV_FILE present (box cut over to Infisical) but the infisical CLI is missing." >&2; exit 1; }
              if { [ -n "${INFISICAL_CLIENT_ID:-}" ] && [ -n "${INFISICAL_CLIENT_SECRET:-}" ]; } || [ -n "${INFISICAL_TOKEN:-}" ]; then
                echo "[deploy] Infisical configured — building with secrets (build:secrets)"
                npm run build:secrets
              else
                echo "[deploy] ERROR: $ENV_FILE present but no usable Infisical credential (need INFISICAL_CLIENT_ID+INFISICAL_CLIENT_SECRET or INFISICAL_TOKEN)." >&2
                exit 1
              fi )
          else
            echo "[deploy] No Infisical bootstrap — plain build"
            npm run build
          fi
          echo "::endgroup::"

          echo "::group::Restart PM2 process ($APP)"
          # PM2 --update-env refreshes the managed process's env from the invoking shell,
          # so the runtime (npm run start:secrets) gets the bootstrap and mints its own
          # token. Source it in a subshell scoped to the restart — never globally.
          if [ -f "$ENV_FILE" ]; then
            ( set -a; . "$ENV_FILE"; set +a; pm2 restart "$APP" --update-env )
          else
            pm2 restart "$APP" --update-env
          fi
          pm2 save
          echo "::endgroup::"
