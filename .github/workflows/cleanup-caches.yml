name: Cleanup Actions Caches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "5 3 * * *" # daily, off-peak
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-caches
  cancel-in-progress: false

jobs:
  delete-pr-caches:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub CLI is on PATH
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          # Pin gh CLI by version + sha256. Do not curl /releases/latest (mutable).
          ver="2.76.2"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=amd64; want=62544b0f3759bbf1155c0ac3d75838b5fe23d66dfb75cf8368f84fff8f82b93e ;;
            aarch64|arm64) arch=arm64; want=a77f6d709c5100cda8e9bbb8d8b7143120121233d9102ba2f2bc254134db18dc ;;
            *) echo "::error::unsupported arch $arch"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin" /tmp/gh-cli-pin
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_${arch}.tar.gz" \
            -o "/tmp/gh-cli-pin/gh_${ver}_linux_${arch}.tar.gz"
          echo "${want}  /tmp/gh-cli-pin/gh_${ver}_linux_${arch}.tar.gz" | sha256sum -c -
          tar -xz -C /tmp/gh-cli-pin -f "/tmp/gh-cli-pin/gh_${ver}_linux_${arch}.tar.gz"
          install -m 0755 "/tmp/gh-cli-pin/gh_${ver}_linux_${arch}/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh" --version
      - name: Delete every cache scoped to this PR's ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          echo "Deleting caches for ref ${PR_REF}..."
          gh cache delete --all --ref "$PR_REF" --succeed-on-no-caches --repo "$REPO"

  prune-stale-caches:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure GitHub CLI is on PATH
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          # Pin gh CLI by version + sha256. Do not curl /releases/latest (mutable).
          ver="2.76.2"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=amd64; want=62544b0f3759bbf1155c0ac3d75838b5fe23d66dfb75cf8368f84fff8f82b93e ;;
            aarch64|arm64) arch=arm64; want=a77f6d709c5100cda8e9bbb8d8b7143120121233d9102ba2f2bc254134db18dc ;;
            *) echo "::error::unsupported arch $arch"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin" /tmp/gh-cli-pin
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_${arch}.tar.gz" \
            -o "/tmp/gh-cli-pin/gh_${ver}_linux_${arch}.tar.gz"
          echo "${want}  /tmp/gh-cli-pin/gh_${ver}_linux_${arch}.tar.gz" | sha256sum -c -
          tar -xz -C /tmp/gh-cli-pin -f "/tmp/gh-cli-pin/gh_${ver}_linux_${arch}.tar.gz"
          install -m 0755 "/tmp/gh-cli-pin/gh_${ver}_linux_${arch}/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh" --version
      - name: Keep only the newest entry per cache key prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Current cache inventory:"
          gh cache list --repo "$REPO" --limit 100 --json id,key,ref,createdAt,sizeInBytes

          # Group by (key prefix before the trailing content hash, ref) and delete everything
          # except the most-recently-created id in each group -- see
          # scripts/prune-stale-actions-caches.py for the grouping rule.
          gh cache list --repo "$REPO" --limit 100 --json id,key,ref,createdAt \
            | python3 scripts/prune-stale-actions-caches.py > /tmp/prune_ids.txt

          if [ ! -s /tmp/prune_ids.txt ]; then
            echo "Nothing to prune — every cache key/ref group already has a single entry."
            exit 0
          fi

          echo "Pruning $(wc -l < /tmp/prune_ids.txt) stale cache entries:"
          while read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting cache id $id"
            gh cache delete "$id" --repo "$REPO" || echo "::warning::failed to delete cache $id (already gone?)"
          done < /tmp/prune_ids.txt
