# Static verification for ST ops shell/Python scripts and systemd units (ST-4624).
# Offline job: no secrets, no production calls. Jay may add as a required check later.
name: Ops scripts

on:
  pull_request:
    paths:
      - "scripts/**"
      - "docs/backup-policy.md"
      - ".github/workflows/ops-scripts.yml"
  merge_group:
    paths:
      - "scripts/**"
      - "docs/backup-policy.md"
      - ".github/workflows/ops-scripts.yml"
  workflow_dispatch:

concurrency:
  group: ops-scripts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-ops-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 / actions/checkout v4

      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_VERSION: "0.10.0"
          SHELLCHECK_SHA256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
        run: |
          set -euo pipefail
          tar="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "/tmp/${tar}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tar}"
          echo "${SHELLCHECK_SHA256}  /tmp/${tar}" | sha256sum -c -
          tar -xJf "/tmp/${tar}" -C /tmp
          sudo mv "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: bash -n all shell scripts under scripts/
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts -type f -name '*.sh' -print0 | sort -z)
          for f in "${files[@]}"; do
            bash -n "$f"
          done
          echo "bash -n: ${#files[@]} scripts OK"

      - name: ShellCheck scripts (severity warning)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts -type f -name '*.sh' -print0 | sort -z)
          shellcheck -S warning "${files[@]}"

      - name: Python syntax (scripts/*.py and scripts/ops/*.py)
        run: |
          set -euo pipefail
          mapfile -t py_files < <(
            find scripts -maxdepth 1 -type f -name '*.py' -print
            find scripts/ops -type f -name '*.py' -print 2>/dev/null || true
          )
          for f in "${py_files[@]}"; do
            python3 -m py_compile "$f"
          done
          echo "py_compile: ${#py_files[@]} modules OK"
          if [ -d scripts/tests ]; then
            python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          else
            echo "scripts/tests absent; skipping unittest discover"
          fi

      - name: Ops selftests (offline)
        run: |
          set -euo pipefail
          bash scripts/ops/st-container-restart-monitor.selftest.sh
          COOLIFY_SELFTEST_MODE=anchors-only \
            bash scripts/ops/coolify-st-pull-guard.selftest.sh scripts/ops/coolify-st-pull-guard.sh

      - name: systemd-analyze verify (ST units, stubbed ExecStart)
        run: |
          set -euo pipefail
          W="$(mktemp -d)"
          trap 'rm -rf "$W"' EXIT
          for src in \
            scripts/ops/st-container-restart-monitor.service \
            scripts/ops/st-container-restart-monitor.timer \
            scripts/ops/litestream-l1-boundary-trim.service \
            scripts/ops/litestream-l1-boundary-trim.timer
          do
            base="$(basename "$src")"
            sed -E 's|^ExecStart=.*|ExecStart=/bin/true|' "$src" >"$W/$base"
          done
          systemd-analyze verify "$W"/*.service "$W"/*.timer
