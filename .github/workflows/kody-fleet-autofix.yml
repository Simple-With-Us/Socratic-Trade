# Enabled fleet wide by the owner on 2026-10-11 (boards 04b963b7 and 99e559ea).
# MiniMax M3.1 Flash via its direct OpenAI-compatible endpoint, paid; at most 5 attempts per UTC day in this repository.
name: Kody MiniMax M3.1 Flash Fix Proposals

# Generated offline.  Missing SWU_KODY_AUTOFIX_ENABLED means disabled.
# MODEL_API_KEY is forwarded explicitly; secrets are never inherited.
# Budget approval and protected-environment setup are separate owner actions.
# Daily attempt slots bound this repository only; they are not a dollar cap.
on:
  check_run:
    types: [completed]

permissions: {}
# Shared with the fleet's other PR autofix callers so only one autofix runs per PR.
concurrency:
  group: pr-autofix-${{ github.repository }}-${{ github.event.check_run.pull_requests[0].number || github.event.check_run.id }}
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      vars.SWU_KODY_AUTOFIX_ENABLED == 'true' &&
      github.event_name == 'check_run' && github.event.action == 'completed' &&
      github.run_attempt == 1 &&
      github.event.check_run.app.id == 413034 &&
      github.event.sender.type == 'Bot' && github.event.sender.id == 148880201 &&
      github.event.sender.login == 'kody-ai[bot]' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.pull_requests[0].number != null &&
      github.event.check_run.pull_requests[1] == null
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    uses: Simple-With-Us/congress-trading-shared/.github/workflows/kody-autofix-reusable.yml@917a49dfb77e4fce307a985510ab814a6f684ef6
    with:
      repository_id: '1270451796'
      profile: 'web'
      source_prefixes: '["src/","app/"]'
      daily_attempt_limit: 5
      budget_policy_id: 'approved-owner-2026-10-11'
      model: 'MiniMax-M3.1-Flash'
      model_base_url: 'https://api.minimax.io/v1'
    secrets:
      MODEL_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      USAGE_INGEST_TOKEN: ${{ secrets.USAGE_INGEST_TOKEN }}


  # AFC-812: the reusable's classify in-flight gate disarms while this lane is
  # queued or in flight, and re-arming waits for a pull_request event that may
  # never come.  When the lane settles successfully, hand the PR number to the
  # Auto-merge re-arm workflow (workflow_run-triggered), which pokes the gate
  # only AFTER this run has fully completed (Kody #5416: an in-lane dispatch
  # races the in-flight gate and is swallowed).
  rearm-gate:
    needs: [propose]
    if: needs.propose.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Hand the PR number to the re-arm workflow
        env:
          PR_NUMBER: ${{ github.event.check_run.pull_requests[0].number || '' }}
        run: |
          [ -n "$PR_NUMBER" ] || { echo "no PR context; nothing to hand off"; exit 0; }
          printf '%s' "$PR_NUMBER" > rearm-pr-number.txt
      - uses: actions/upload-artifact@v7
        with:
          name: rearm-pr-number
          path: rearm-pr-number.txt
          retention-days: 1
          if-no-files-found: ignore
