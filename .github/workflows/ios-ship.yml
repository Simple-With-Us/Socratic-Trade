name: iOS TestFlight ship

# Archive + upload on GitHub-hosted macos-latest so TestFlight (the phone)
# actually updates when iOS code lands on main. Unsigned compile stays in
# ios-build.yml. Do not run xcodebuild locally. Do not restart the retired
# self-hosted mac-xcode26-socratic runner or /Users/jay/apps/ios-fleet.
#
# Signing: scripts/ios-appstore-gm-prepare.sh imports the signing identity from Infisical prod
# (identity stays on GitHub; leftover GH ASC_/IOS_DIST_ for later cleanup) (same names as Congress.Trade: ASC_KEY_ID, ASC_ISSUER_ID,
# ASC_KEY_P8, IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD). Never mint a new
# App Store Connect key. The fleet script also declares export compliance
# so a missing ITSAppUsesNonExemptEncryption cannot leave a VALID-but-unusable
# build (ST 1.0.1/2, 2026-08-12).
#
# IOS_MANUAL_SIGN=1 (2026-09-30): Release signs MANUALLY with the App Store
# profile in ios/appstore-profiles.json, which scripts/ios-install-appstore-profiles.sh
# downloads over the App Store Connect API.  Xcode 26 automatic signing calls
# developerservices2.apple.com and the fleet API key gets HTTP 401 there, so this
# job must not ask Xcode's provisioning service for anything.  Upload is
# local IPA export + altool with the API key.
# See docs/rollouts/2026-09-30-st-ios-first-ship.md.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ship.yml'
      - 'scripts/ios-ship-testflight.sh'
      - 'scripts/ios-appstore-gm-prepare.sh'
      - 'scripts/ios-asc-key-env.sh'
      - 'scripts/ios-stage-asc-key.sh'
      - 'scripts/ios-install-appstore-profiles.sh'
      - 'scripts/ios-collect-ship-logs.sh'
      - 'scripts/ios-fleet/**'
      - 'scripts/ios-fleet-pin.sh'
      - 'scripts/ios-fleet.sha256'
  workflow_dispatch:
    inputs:
      export_only:
        description: 'Archive + export the IPA only; do not upload (signing check)'
        type: boolean
        default: false
  schedule:
    - cron: '*/30 * * * *'

# WHY THE CRON EXISTS, AND WHY IT NEEDS A GATE
# --------------------------------------------
# `push:` alone is not a reliable trigger. A PR merged by github-actions[bot]
# lands on main under GitHub's recursion guard and dispatches NOTHING: PR #2675
# (bot-merged, sha ca38bb2979) has 27 runs on that sha and zero are
# `event: push`; PR #2680 (human-merged) got the full set. So iOS code can
# reach main and never reach a phone, and the cron is what notices.
#
# But a cron carries no `paths:` filter, and the ship script's own gate only
# knows "is HEAD the sha I last shipped" plus a time interval -- neither of
# which knows whether ios/ changed. That gap already fired here: run
# 31723515355 (event=schedule, 2026-08-13T17:00Z) archived and shipped sha
# 39c6acee, a pure-backend alerts fix touching zero files under ios/. The
# "Scheduled ship gate" step below is what stops that, and it is why this
# workflow can keep a 30-minute tick without spamming TestFlight.
#
# Hosted runners have an empty home directory each job, so ~/.cache/ios-fleet
# is restored from actions/cache. Without that cache every scheduled tick
# would look like "no prior ship" and re-archive.

permissions:
  contents: read

concurrency:
  group: ios-ship-socratic
  cancel-in-progress: false

jobs:
  ship:
    name: TestFlight archive + upload
    if: github.event.repository.fork == false
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Fallback when Infisical prod has no SENTRY_DSN.  The load step overwrites
      # this via GITHUB_ENV when Infisical returns a value.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. The default depth-1 checkout
      # leaves the runner workspace with exactly ONE commit (verified 2026-08-13:
      # `git rev-parse --is-shallow-repository` -> true, `rev-list --count HEAD` -> 1),
      # so `git log <last-shipped-sha>..HEAD` fails with "unknown revision" and the
      # TestFlight "What to Test" release notes the fleet ship script now generates
      # would silently come out empty on every CI ship.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Restore iOS ship state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-socratic-${{ github.run_id }}
          restore-keys: |
            ios-fleet-socratic-

      # Runs FIRST so a tick with nothing to ship costs seconds and cannot go
      # red on an unrelated environment problem. The logic lives in a script,
      # not inline YAML, so CI can unit-test it on every PR -- otherwise it
      # would only ever execute on the one Mac that can ship.
      - name: Scheduled ship gate (skip unless a ship path changed)
        id: gate
        run: |
          # These flags must mirror on.push.paths above entry-for-entry: the
          # cron carries no paths filter, so the gate replays it. A missed
          # push (disabled workflow, dropped event, bot merge) still ships
          # iff a push path changed since the last ship.
          bash "$GITHUB_WORKSPACE/scripts/ios-scheduled-ship-gate.sh" \
            --event "${{ github.event_name }}" \
            --path-prefix 'ios/**' \
            --path-prefix '.github/workflows/ios-ship.yml' \
            --path-prefix 'scripts/ios-ship-testflight.sh' \
            --path-prefix 'scripts/ios-appstore-gm-prepare.sh' \
            --path-prefix 'scripts/ios-asc-key-env.sh' \
            --path-prefix 'scripts/ios-stage-asc-key.sh' \
            --path-prefix 'scripts/ios-install-appstore-profiles.sh' \
            --path-prefix 'scripts/ios-collect-ship-logs.sh' \
            --path-prefix 'scripts/ios-fleet/**' \
            --path-prefix 'scripts/ios-fleet-pin.sh' \
            --path-prefix 'scripts/ios-fleet.sha256' \
            --repo-root "$GITHUB_WORKSPACE" \
            socratic

      - name: Verify in-repo ios-fleet pin
        if: steps.gate.outputs.should_ship == '1'
        run: bash scripts/ios-fleet-pin.sh --check

      - name: Assert stable Xcode (never beta)
        if: steps.gate.outputs.should_ship == '1'
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode version: ${ver}"
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac
          if xcodebuild -version | grep -qi beta; then
            echo "::error::xcodebuild reports a beta Xcode toolchain"
            exit 1
          fi
          os=$(sw_vers -productVersion)
          build=$(sw_vers -buildVersion)
          echo "macOS ${os} (${build})"
          if echo "$build" | grep -Eq '[0-9][a-z]$'; then
            echo "::error::macOS ${os} build ${build} is a beta host. App Store rejects these as INVALID_BINARY."
            exit 1
          fi

      # Do not use `secrets.*` in `if:` -- GitHub's dispatch parser rejects it
      # (`Unrecognized named-value: secrets`) and the whole workflow dies at 0s.

      # Identity stays on GitHub.  Apple/iOS signing material comes from Infisical prod.
      - name: Load Infisical signing secrets
        if: steps.gate.outputs.should_ship == '1'
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set +o xtrace
          set -euo pipefail
          export INFISICAL_DISABLE_UPDATE_CHECK=true

          if ! command -v infisical >/dev/null 2>&1; then
            NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install infisical/get-cli/infisical
          fi
          command -v infisical >/dev/null 2>&1 || {
            echo "::error::Infisical CLI is not installed."
            exit 1
          }

          if [ -z "${INFISICAL_PROJECT_ID}" ]; then
            echo "::error::Missing INFISICAL_PROJECT_ID GitHub secret."
            exit 1
          fi
          CLIENT_ID="${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}"
          CLIENT_SECRET="${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            CLIENT_ID="${INFISICAL_CLIENT_ID}"
            CLIENT_SECRET="${INFISICAL_CLIENT_SECRET}"
          fi
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Missing Infisical machine identity.  Set INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET (fallback INFISICAL_CLIENT_ID/SECRET) on the repo."
            exit 1
          fi

          TOKEN="$(
            env -u INFISICAL_CLIENT_ID -u INFISICAL_CLIENT_SECRET -u INFISICAL_TOKEN \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$CLIENT_ID" \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$CLIENT_SECRET" \
              infisical login --method=universal-auth --silent --plain --telemetry=false 2>/dev/null || true
          )"
          if [ -z "$TOKEN" ]; then
            echo "::error::Infisical universal-auth login failed."
            exit 1
          fi
          if [[ "$TOKEN" == *$'\n'* || "$TOKEN" == *$'\r'* ]]; then
            echo '::error::Infisical returned a multiline token.' >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "${TOKEN//'%'/'%25'}"

          # The App Store Connect trio has exactly one home:  Fleet-OPS /asc
          # (owner ruling 2026-10-11; any app may use it, ruling 2026-10-17).
          # This repository's INFISICAL_PROJECT_ID is the application project,
          # which has no /asc folder, so a read against it returns nothing
          # (ST-4579).  There is no second source and no override:  Infisical
          # is the only source of truth, and a missing or unreadable secret
          # stops the run with a message that names it (owner policy
          # 2026-10-24, no fallbacks, no overrides).
          FLEET_ASC_PROJECT_ID="8dae6d03-8f12-48b2-adf3-e5c1b881c8c5"
          asc_get() {
            INFISICAL_TOKEN="$TOKEN" infisical secrets get "$1" \
              --plain --silent --telemetry=false --expand=false \
              --projectId="$2" --env=prod --path="$3" \
              2>/dev/null
          }
          # read_required <variable> <secret> <project> <path> <label>
          # A failed read (expired token, revoked grant, outage) and an empty
          # value are different faults, so they get different messages:  a
          # failed read never claims the secret is missing.  A blank value
          # (only whitespace) counts as missing, because every consumer
          # trims it and would reject it later with a vaguer error.
          read_required() {
            local value
            if ! value="$(asc_get "$2" "$3" "$4")"; then
              echo "::error::Could not read required secret $2 from Infisical prod ($5):  the read failed, so it is not known whether the secret is missing." >&2
              exit 1
            fi
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "::error::Missing required secret $2 in Infisical prod ($5)." >&2
              exit 1
            fi
            printf -v "$1" '%s' "$value"
          }
          # Read the trio once, together, from the one source, and reuse the
          # values below:  the three names always come from the same project.
          read_required asc_key_id ASC_KEY_ID "$FLEET_ASC_PROJECT_ID" /asc "Fleet-OPS /asc"
          read_required asc_issuer_id ASC_ISSUER_ID "$FLEET_ASC_PROJECT_ID" /asc "Fleet-OPS /asc"
          read_required key_material ASC_KEY_P8 "$FLEET_ASC_PROJECT_ID" /asc "Fleet-OPS /asc"

          for name in ASC_KEY_ID ASC_ISSUER_ID \
                      IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD; do
            # The ASC ids were read above from Fleet-OPS /asc and are reused
            # here; the certificate material comes from this project's root.
            case "$name" in
              ASC_KEY_ID) val="$asc_key_id" ;;
              ASC_ISSUER_ID) val="$asc_issuer_id" ;;
              # Every signing field is required:  an unreadable, empty or blank
              # value stops the step here, naming the secret, instead of
              # skipping it and failing later in the import (owner policy
              # 2026-10-24, no fallbacks).
              *) read_required val "$name" "$INFISICAL_PROJECT_ID" / "application project root" ;;
            esac
            if [[ "$val" == *$'\n'* || "$val" == *$'\r'* ]]; then
              echo "::error::Signing field $name must be single-line; correct Infisical formatting." >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "${val//'%'/'%25'}"
            printf -v "$name" '%s' "$val"
            export "$name"
            # Certificate credentials belong only to this load/import step.
            if [[ "$name" == ASC_KEY_ID || "$name" == ASC_ISSUER_ID ]]; then
              printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
            fi
          done
          # The key material is fetched here and never leaves this step:  the
          # environment file must not hold key material (the staging script
          # publishes only its path).  The steps that call the client fetch
          # the key themselves, in their own step, through
          # scripts/ios-asc-key-env.sh, and hand it to the client in the
          # environment:  a path on disk is not a credential source
          # (AFC-459, revision 2).
          printf '%s\n' "$key_material" | bash "$GITHUB_WORKSPACE/scripts/ios-stage-asc-key.sh"
          ASC_KEY_PATH="$(sed -n 's/^ASC_KEY_PATH=//p' "$GITHUB_ENV" | tail -n 1)"
          export ASC_KEY_PATH
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"

          # Cocoa reads Info.plist $(SENTRY_DSN).  Empty / unsubstituted is a
          # deliberate no-op (no hardcoded ingest).  Same Infisical name Coolify
          # already uses for the server SDK.
          sentry_dsn="$(
            INFISICAL_TOKEN="$TOKEN" infisical secrets get SENTRY_DSN \
              --plain --silent --telemetry=false --expand=false \
              --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
              2>/dev/null || true
          )"
          if [ -n "$sentry_dsn" ]; then
            if [[ "$sentry_dsn" == *$'\n'* || "$sentry_dsn" == *$'\r'* ]]; then
              echo "::error::SENTRY_DSN must be single-line; correct Infisical formatting." >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "${sentry_dsn//'%'/'%25'}"
            printf 'SENTRY_DSN=%s\n' "$sentry_dsn" >> "$GITHUB_ENV"
            echo "SENTRY_DSN loaded from Infisical prod (length ${#sentry_dsn})"
          else
            echo "SENTRY_DSN not in Infisical prod; Cocoa no-ops unless the GitHub Actions secret is set"
          fi
          unset sentry_dsn key_material TOKEN CLIENT_ID CLIENT_SECRET val IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD

      - name: Ensure Xcode 26 project format (objectVersion 100)
        if: steps.gate.outputs.should_ship == '1'
        run: python3 ios/xcodegen-post.py

      - name: Report runtime ios-fleet drift (advisory)
        if: steps.gate.outputs.should_ship == '1'
        run: bash "$GITHUB_WORKSPACE/scripts/ios-fleet/check-drift.sh"

      # The ship script regenerates the Xcode project when `xcodegen` is on PATH.
      # macos-latest does not ship it.  Without this step the archive uses the
      # checked-in pbxproj, whose project-level SENTRY_DSN = "" overrides
      # Config/Sentry.xcconfig.  The xcodebuild SENTRY_DSN= flag still wins;
      # generate is what drops the empty setting.  Same 2.46.0 pin as ios-build.yml.
      - name: Install XcodeGen
        if: steps.gate.outputs.should_ship == '1'
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen already on PATH: $(command -v xcodegen)"
            exit 0
          fi
          ver="2.46.0"
          zip="$RUNNER_TEMP/xcodegen.zip"
          dest="$RUNNER_TEMP/xcodegen-$ver"
          curl -fsSL -o "$zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${ver}/xcodegen.zip"
          rm -rf "$dest"
          mkdir -p "$dest"
          unzip -q "$zip" -d "$dest"
          if [ -x "$dest/bin/xcodegen" ]; then
            bin="$dest/bin"
          elif [ -x "$dest/xcodegen/bin/xcodegen" ]; then
            bin="$dest/xcodegen/bin"
          else
            xcg_all="$(find "$dest" -type f -name xcodegen -perm -111)"
            xcg="${xcg_all%%$'\n'*}"
            if [ -z "${xcg:-}" ] || [ ! -x "$xcg" ]; then
              echo "::error::xcodegen binary not found in release zip ${ver}"
              find "$dest" -maxdepth 4 -type f
              exit 1
            fi
            bin="$(dirname "$xcg")"
          fi
          echo "$bin" >> "$GITHUB_PATH"

      # No IOS_TF_MIN_INTERVAL_SEC here. That variable is a PER-RUN override.
      # Standing gate is DEFAULT_MIN_INTERVAL_SEC=3600 (1 hour) in the fleet
      # script (owner 2026-08-14). The 30-minute cron picks up an unbuilt merge
      # on the next eligible hour; same-HEAD ticks still exit 0 without shipping.
      - name: Ship SocraticTrade to TestFlight
        if: steps.gate.outputs.should_ship == '1'
        env:
          IOS_TF_RELEASE_NOTES: "1"  # Jay 2026-09-08: publish ASC What to Test
          IOS_MANUAL_SIGN: "1"  # 2026-09-30: App Store profile, no Xcode provisioning service
          EXPORT_ONLY_INPUT: ${{ inputs.export_only }}
          # The client takes the key from the environment, never from a path
          # (AFC-459, revision 2), and no key material may cross a step
          # boundary, so this step fetches the key itself.
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          # The fleet iOS version manifest lives in AI-Fleet-Coordinator, and
          # that repository's ruleset refuses a direct write to its protected
          # branch, so the publish is a branch plus a pull request.  The
          # workflow's own GITHUB_TOKEN is read-only by declaration and cannot
          # write to another repository, so the fleet's elevated token is
          # passed for that one step.  The publisher refuses GITHUB_TOKEN
          # outright, and it never arms auto-merge with one.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          args=()
          if [ "${EXPORT_ONLY_INPUT:-false}" = "true" ]; then
            echo "[ios-ship] export_only=true: archive + export the IPA, no upload"
            args+=(--export-only)
          fi
          bash scripts/ios-asc-key-env.sh bash scripts/ios-ship-testflight.sh ${args[@]+"${args[@]}"}

      # Archive/export/upload logs are tee'd into the job log, but Xcode's
      # .xcdistributionlogs are not.  Collect both on failure, redact the ASC and
      # Sentry identifiers, and refuse to upload anything holding key material.
      - name: Collect ship logs (failure only)
        id: shiplogs
        if: failure() && steps.gate.outputs.should_ship == '1'
        run: bash scripts/ios-collect-ship-logs.sh "$RUNNER_TEMP/ios-ship-logs"

      - name: Upload ship logs (failure only)
        if: failure() && steps.shiplogs.outputs.safe == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ship-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-ship-logs
          retention-days: 7
          if-no-files-found: ignore
