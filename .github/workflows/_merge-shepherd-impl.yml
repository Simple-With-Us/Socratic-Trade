name: _merge-shepherd-impl

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Report only, change nothing'
        type: boolean
        default: false

jobs:
  shepherd:
    runs-on: ubuntu-latest
    environment: merge-shepherd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Install pinned Infisical CLI
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/wise-infisical-cli"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/Infisical/cli/releases/download/v0.43.141/cli_0.43.141_linux_amd64.tar.gz \
            --output "$install_dir/cli.tar.gz"
          printf '%s  %s\n' d93a9b5ae46c6097889926b95c1c09992f44619053793eaa61d66884726c95e5 "$install_dir/cli.tar.gz" | sha256sum --check --status
          tar -xzf "$install_dir/cli.tar.gz" -C "$install_dir" infisical
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Run merge shepherd
        env:
          INFISICAL_TOKEN: ${{ secrets.WISE_RELAY_INFISICAL_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHEPHERD_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 scripts/wise-relay-exec.py -- bash scripts/merge-shepherd.sh
