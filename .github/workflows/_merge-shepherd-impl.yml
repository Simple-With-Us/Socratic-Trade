name: _merge-shepherd-impl

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Report only, change nothing'
        type: boolean
        default: false

jobs:
  shepherd:
    runs-on: ubuntu-latest
    environment: merge-shepherd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Run merge shepherd
        env:
          GH_TOKEN: ${{ secrets.SHEPHERD_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHEPHERD_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SHEPHERD_HAS_PAT: ${{ secrets.SHEPHERD_TOKEN != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN always posts as github-actions[bot].  A PAT posts as its
          # owner, so resolve that login once and fail clearly if it cannot be
          # read: guessing an actor would make the shepherd trust the wrong
          # rerun markers.  The next scheduled run retries.
          actor=github-actions[bot]
          if [ "${{ secrets.SHEPHERD_TOKEN != '' && '1' || '0' }}" = "1" ]; then
            if ! actor="$(gh api user --jq .login)" || [ -z "$actor" ]; then
              echo "::error::merge-shepherd: could not resolve the SHEPHERD_TOKEN owner via gh api user; refusing to guess the actor" >&2
              exit 1
            fi
          fi
          bash scripts/merge-shepherd.sh --expected-actor "$actor"
