name: Dispatch verified PR #4210 main sync

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact PR 4210 head SHA; workflow refuses if it changed
        type: string
        required: true
      expected_main_sha:
        description: Exact main SHA to merge; workflow refuses if main changed
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dispatch-conflict-merge-4210
  cancel-in-progress: false

jobs:
  merge-pr-4210:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: cursor/stall-halt-streak-exempt-d19f
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR and exact revisions
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]]
          pr="$(gh api repos/${GITHUB_REPOSITORY}/pulls/4210)"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .base.ref <<<"$pr")" = main
          test "$(jq -r .head.ref <<<"$pr")" = cursor/stall-halt-streak-exempt-d19f
          test "$(jq -r .head.sha <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)" = "$EXPECTED_MAIN"

      - name: Merge main and verify expected tree
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-commit --no-ff "$EXPECTED_MAIN"
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Merge main into PR #4210'
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MAIN"
          cat > /tmp/expected-files <<'FILES'
          PLAN.md
          STATUS.md
          docs/EFFORT-LOG.md
          docs/rollouts/2026-09-30-self-healing-watchdogs.md
          docs/rollouts/2026-10-05-stall-failures-exempt-halt-streak.md
          src/lib/db-execution.ts
          src/lib/run-failure-watchdog.ts
          src/lib/trading-liveness.ts
          test/run-failure-watchdog.test.ts
          test/stale-running-runs.test.ts
          test/trading-liveness.test.ts
          FILES
          sed -i 's/^          //' /tmp/expected-files
          git diff --name-only "$EXPECTED_MAIN" HEAD | LC_ALL=C sort > /tmp/actual-files
          LC_ALL=C sort /tmp/expected-files > /tmp/expected-files-sorted
          diff -u /tmp/expected-files-sorted /tmp/actual-files
          python3 - "$EXPECTED_MAIN" <<'PY'
          import pathlib, re, subprocess, sys
          names = subprocess.check_output(['git','diff','--name-only','-z',sys.argv[1],'HEAD']).decode().split('\0')
          marker = re.compile(r'^(<<<<<<< |=======|>>>>>>> )', re.M)
          for name in filter(None, names):
              try:
                  text = pathlib.Path(name).read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if marker.search(text):
                  print(f'Conflict marker found in {name}', file=sys.stderr)
                  sys.exit(1)
          status = pathlib.Path('STATUS.md').read_text(encoding='utf-8')
          effort = pathlib.Path('docs/EFFORT-LOG.md').read_text(encoding='utf-8')
          assert '2026-10-05 CURSOR — Broker I/O bounded lanes' in status
          assert 'App-stall failures exempt from Autopilot auto-halt' in status
          assert 'Broker I/O bounded lanes (board `28996d824eee4919`)' in effort
          assert 'App-stall failures exempt from Autopilot auto-halt' in effort
          PY

      - name: Revalidate remote refs and push with GH_PAT
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test -n "$GH_PAT"
          remote_head="$(git ls-remote origin refs/heads/cursor/stall-halt-streak-exempt-d19f | cut -f1)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          test "$remote_main" = "$EXPECTED_MAIN"
          pr="$(gh api repos/${GITHUB_REPOSITORY}/pulls/4210)"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .head.sha <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .commit.sha)" = "$EXPECTED_MAIN"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)" \
            push origin HEAD:refs/heads/cursor/stall-halt-streak-exempt-d19f
