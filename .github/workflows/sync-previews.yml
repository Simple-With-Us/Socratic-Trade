name: Sync Preview Lanes

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: sync-preview-lanes
  cancel-in-progress: false

jobs:
  sync-previews:
    runs-on: [self-hosted, trading-live]
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync beta and per-agent previews
        shell: bash
        run: bash scripts/sync-preview-lanes.sh
