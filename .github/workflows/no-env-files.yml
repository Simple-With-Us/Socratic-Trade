name: No env files

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-env-files:
    name: No env files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail if an env or vars file is tracked
        run: |
          tracked=$(git ls-files)
          bad=$(printf '%s\n' "$tracked" | grep -E '(^|/)[^/]*(\.env|\.vars|\.envrc)(\.[^/]*)?$' | grep -Ev '\.(example|sample|template)$' | grep -Ev '(^|/)\.cursor/infisical\.env$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked env or vars files are not allowed. All secrets live only in Infisical."
            echo "$bad"
            exit 1
          fi
      - name: Check Infisical coordinates files hold no secrets
        run: |
          status=0
          tracked=$(git ls-files)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if grep -Ev '^[[:space:]]*(#.*)?$' "$f" | grep -Evq '^INFISICAL_(PROJECT_ID|ENV|DOMAIN)=[A-Za-z0-9._:/@-]*$'; then
              echo "::error::$f may hold only INFISICAL_PROJECT_ID, INFISICAL_ENV and INFISICAL_DOMAIN"
              status=1
            fi
          done < <(printf '%s\n' "$tracked" | grep -E '(^|/)\.cursor/infisical\.env$' || true)
          exit $status
