name: Sentry Deploy

# CI is only the trigger.  The reporter independently verifies production.
on:
  pull_request:
    paths:
      - .github/workflows/sentry-deploy.yml
      - scripts/sentry-report-deploy*
      - scripts/sentry-build-release.cjs
      - next.config.*
      - Dockerfile
  workflow_run:
    workflows: [CI, RTH Deploy Latch]
    types: [completed]

permissions:
  contents: read

# Serialize every reporter for this environment, including runs for newer SHAs.
concurrency:
  group: sentry-deploy-${{ github.event_name == 'workflow_run' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  test-reporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - run: node --test scripts/sentry-report-deploy.node-test.mjs

  record-production-deploy:
    needs: test-reporter
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.repository_id &&
      (
        (github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'push') ||
        (github.event.workflow_run.name == 'RTH Deploy Latch' &&
          (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Test deployment evidence and reporting
        run: node --test scripts/sentry-report-deploy.node-test.mjs
      - name: Evaluate weekday RTH / image-noop latch
        id: latch
        if: github.event.workflow_run.name == 'CI'
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          OUT="$(npx --yes tsx scripts/assert-rth-deploy-latch.ts 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -eq 2 ]; then
            echo "skip=rth-blocked" >> "$GITHUB_OUTPUT"
          elif [ "$RC" -eq 3 ]; then
            echo "skip=image-noop" >> "$GITHUB_OUTPUT"
          elif [ "$RC" -ne 0 ]; then
            exit "$RC"
          fi
      - name: Verify live revision and record Sentry deployment
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          SENTRY_DEPLOY_SKIP_REASON: ${{ steps.latch.outputs.skip }}
        run: node scripts/sentry-report-deploy.mjs
