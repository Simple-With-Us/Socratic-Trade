name: Sentry Deploy

# CI is only the trigger.  The reporter independently verifies production.
on:
  pull_request:
    paths:
      - .github/workflows/sentry-deploy.yml
      - scripts/sentry-report-deploy*
      - scripts/sentry-build-release.cjs
      - next.config.*
      - Dockerfile
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

# Serialize every reporter for this environment, including runs for newer SHAs.
concurrency:
  group: sentry-deploy-${{ github.event_name == 'workflow_run' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  test-reporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: node --test scripts/sentry-report-deploy.node-test.mjs

  record-production-deploy:
    needs: test-reporter
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.id == github.repository_id
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Test deployment evidence and reporting
        run: node --test scripts/sentry-report-deploy.node-test.mjs
      - name: Verify live revision and record Sentry deployment
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/sentry-report-deploy.mjs
