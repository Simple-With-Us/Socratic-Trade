name: Shared package pin check

# Guards @jaywedgeworth22/congress-trading-shared across the three consumers:
#   ST  = this repo (npm git tag in package.json + lock SHA)
#   UM  = Usage-Monitor (public npm git tag)
#   CT  = Congress.Trade vendor tree (VENDOR-PROVENANCE.md; no npm dep)
#
# A missing CT npm spec is NOT "skip and pass" -- CT is vendor-only. The
# script fails if CT cannot be read, if versions diverge, or if CT
# reintroduces an npm dependency. See scripts/check-shared-package-pin.mjs.
#
# Required check name: `check-pin` (ruleset main-protection). Both consumers pin a public
# git dependency, so this job must RUN on fork PRs too -- a skipped required check is
# treated as satisfied. Congress.Trade is public. The script reads it with the Actions
# installation token first. GH_PACKAGES_TOKEN is a user PAT fallback only. Preferring
# that PAT makes a burst of pull requests share one rate limit and fail together.
#
# Keep this file ASCII-only (AGENTS.md) -- no em dashes / arrows near $VARs.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  check-pin:
    # Must run on fork PRs. GitHub treats a skipped required check as satisfied.
    # Congress.Trade is public, so GITHUB_TOKEN can read the peer package.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # Keep the consumer manifest present even if cleanup from a prior job
      # overlaps this long-lived runner workspace after the first checkout.
      - name: Refresh checkout before reading package metadata
        uses: actions/checkout@v7

      - name: Compare ST / UM / CT shared-package pins
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: node scripts/check-shared-package-pin.mjs
