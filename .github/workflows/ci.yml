# The `verify` job below is the REQUIRED status check gating every merge to `main`
# (enforced by the `main-protection` ruleset, not classic branch protection). It must be
# green before a PR can merge; `gh pr merge <n> --squash --auto` lands the PR once it passes.
#
# Docs-only fast path (2026-07-04, PR #370): `classify` inspects the PR diff; when it touches
# ONLY documentation-class paths (*.md anywhere, docs/** except build-imported docs/benchmarks/)
# the gate reports success immediately
# without running the suite. Fail-closed in every ambiguous state.
#
# Runner policy (2026-07-29, simplified 2026-08-01): GitHub-hosted `ubuntu-latest` ONLY.
# Every self-hosted runner — the production Mac, the Coolify/Hetzner CI box, the Oracle
# Actions runners — is retired and deleted. There is exactly one verification lane
# (`verify-hosted`) and one gate (`verify`).
#
# History, so nobody re-derives it: this file used to carry a resource-aware hybrid that
# routed the suite to the Mac when a Mac-side publisher advertised spare capacity via the
# VERIFY_RUNNER_STATE repo variable, with Linux as the arbiter. That whole apparatus, plus
# the `verify-self` lane it fed, was removed on 2026-08-01: the routing step had already been
# hardcoded to `route=hosted` since the 2026-07-29 retirement, so `verify-self` was
# unreachable — and had it ever run, it would have failed immediately, because it looked for
# Homebrew's `/opt/homebrew/opt/node@24/bin` on a `runs-on: ubuntu-latest` runner. Dead code
# that contradicted the policy comment above it. To bring a self-hosted lane back, add it
# deliberately with a runner label that actually exists; do not resurrect the old routing.
name: CI

on:
  pull_request:
  # Required for the GitHub merge queue: the `verify` check must run on the
  # queue's temporary merge_group branch, or queued PRs hang forever.
  merge_group:
  push:
    branches:
      - main
  # Cost note (2026-07-05): dropped the `agent/**` push trigger. Every agent branch
  # that lands has an open PR, so the `pull_request` trigger already runs `verify`
  # on it — the extra `push` run was a duplicate of the PR run (different ref, so
  # concurrency never deduped them). `push: main` still covers merges/merge_group.
  # (Cloud-proxy pushes that generate no pull_request event use the workflow_dispatch
  # re-kick lever below, exactly as documented for that edge.)
  # Manual re-kick lever. Pushes/PRs made through the Claude cloud git proxy
  # generate NO pull_request/synchronize workflow runs (observed on PR #367/#798:
  # zero check runs on any head after the proxy pushed), which strands the
  # required `verify` check as "expected" forever and auto-merge never fires.
  # Dispatching this workflow on the PR branch attaches a `verify` check run to
  # the branch-head SHA, which satisfies the ruleset. Trigger from a cloud
  # session with the GitHub MCP actions_run_trigger tool, or:
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:
  schedule:
    # Nightly full-gate canary on main: a continuous baseline independent of PR traffic,
    # and it refreshes the .next build cache during quiet stretches. Runs unconditionally
    # (the redundancy skip below deliberately exempts it) so the cache lineage stays warm.
    - cron: "47 7 * * *"
    # Hourly backstop for commits that reach main WITHOUT dispatching a push event
    # (2026-08-13). GitHub raises no workflow events for anything done with the
    # repository's GITHUB_TOKEN, so a PR merged by github-actions[bot] lands on main and
    # triggers nothing -- verified on PR #2675 (merge sha ca38bb2979: 27 runs on that sha,
    # ZERO of them `event: push`) against #2678/#2679/#2680 (human-merged: full run set).
    # auto-merge-prs.yml now refuses to arm without an elevated token, which is the root
    # fix; this cron is the backstop for anything that still slips through (Dependabot, a
    # future App install, a hand-merge from the GitHub UI by a bot identity).
    # `schedule` is NOT subject to the recursion guard, so it always fires.
    # The redundancy gate in `classify` makes almost every tick a ~10s no-op.
    - cron: "17 * * * *"

# Keep the active verification alive when another commit reaches the same PR. GitHub
# concurrency still retains only the newest pending run, so intermediate pushes collapse
# without cancelling the expensive in-flight suite. This prevents high-churn branches from
# repeatedly losing all progress before `verify` can turn green.
concurrency:
  # Keep one active run and one newest pending run per ref. Including a commit SHA here
  # creates a distinct group for every push, so duplicate pending verifies accumulate
  # indefinitely even though cancellation is disabled (2026-07-22 queue-drain fix).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    # Cheap gate-shape job: is this diff documentation-only? Only `pull_request` gets the
    # docs fast path. Fork PRs are rejected at admission.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by the hourly-backstop redundancy check below, which asks the Actions
      # API whether main's current HEAD already has a green CI run.
      actions: read
    outputs:
      docs-only: ${{ steps.check.outputs.docs_only }}
      redundant: ${{ steps.backstop.outputs.redundant }}
    steps:
      - name: Disable lingering sparse-checkout
        run: rm -rf ./* ./.git || true
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # Classify only needs the two endpoint trees. Full-history fetches can
          # monopolize the single self-hosted runner before this cheap gate runs.
          fetch-depth: 1
          fetch-tags: false
          ref: ${{ github.sha }}
      - name: Determine whether the diff is documentation-only
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event (${{ github.event_name }}) — running full gate."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Missing base/head SHA — running full gate to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --no-tags --depth=1 origin "$base" "$head"; then
            echo "Could not fetch base/head endpoint commits — running full gate to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-renames is load-bearing (Codex review, PR #370): with rename detection
          # active, `git diff --name-only` reports ONLY the destination path of a rename,
          # so `git mv src/foo.ts docs/foo.md` would list just docs/foo.md and classify as
          # docs-only while code was removed. --no-renames splits every rename into
          # delete(old)+add(new) so BOTH paths get classified.
          changed_files="$(git diff --name-only --no-renames "$base" "$head" 2>/dev/null || true)"
          if [ -z "$changed_files" ]; then
            echo "Could not compute a changed-files list — running full gate to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          non_docs="$(printf '%s\n' "$changed_files" | grep -Ev '(^|/)[^/]+\.md$|^docs/' || true)"
          # docs/benchmarks/* is bundled at build time (app/api/llm-usage/model-stats/route.ts) — not
          # safe to skip lint/tsc/test/build when only those JSON files change.
          benchmarks_changed="$(printf '%s\n' "$changed_files" | grep -E '^docs/benchmarks/' || true)"
          if [ -n "$benchmarks_changed" ]; then
            non_docs="$(printf '%s\n%s' "$non_docs" "$benchmarks_changed" | sed '/^$/d' | sort -u)"
          fi
          if [ -z "$non_docs" ]; then
            echo "All changed files are documentation-class (*.md or docs/**, excluding build-imported docs/benchmarks/) — docs-only fast path applies."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-documentation files changed — running full gate:"
            echo "$non_docs"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      # Hourly-backstop redundancy gate. The `17 * * * *` cron exists only to verify main
      # HEADs that arrived without a push event; when main HEAD already has a successful
      # CI run there is nothing to do, so skip the ~15-minute suite. Applies ONLY to that
      # cron -- the nightly `47 7 * * *` canary stays unconditional so the Next build-cache
      # lineage keeps getting refreshed.
      #
      # FAIL-CLOSED: any API/parse problem leaves redundant=false, i.e. the full gate runs.
      # A gate that skips on error would silently stop being a backstop at all.
      - name: Skip hourly backstop when main HEAD is already verified
        id: backstop
        if: github.event_name == 'schedule' && github.event.schedule == '17 * * * *'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_RUN_ID: ${{ github.run_id }}
          # This run's OWN head sha, which for a schedule event is main HEAD at trigger
          # time -- and, crucially, is exactly the tree `actions/checkout` would give
          # verify-hosted. Re-resolving main HEAD through the API could return a newer
          # commit than this run would actually verify, so the answer would be about the
          # wrong tree.
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          head_sha="$HEAD_SHA"
          if [ -z "$head_sha" ]; then
            echo "No head sha on this run -- running the full gate (fail-closed)."
            echo "redundant=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "this run's head sha (main HEAD at trigger): $head_sha"
          # This run is itself attached to that sha and is in_progress, so exclude it
          # explicitly rather than relying on its conclusion being null.
          green="$(gh api "repos/${REPO}/actions/runs?head_sha=${head_sha}&per_page=100" \
                     --jq "[.workflow_runs[]
                            | select(.name == \"CI\")
                            | select((.id|tostring) != \"${THIS_RUN_ID}\")
                            | select(.conclusion == \"success\")] | length" 2>/dev/null || echo "")"
          if ! printf '%s' "${green}" | grep -Eq '^[0-9]+$'; then
            echo "Could not count prior CI runs for ${head_sha} -- running the full gate (fail-closed)."
            echo "redundant=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$green" -gt 0 ]; then
            echo "main HEAD ${head_sha} already has ${green} successful CI run(s) -- backstop not needed."
            echo "redundant=true" >> "$GITHUB_OUTPUT"
          else
            echo "main HEAD ${head_sha} has NO successful CI run -- this is exactly the case"
            echo "the backstop exists for (a commit that reached main without a push event)."
            echo "redundant=false" >> "$GITHUB_OUTPUT"
          fi

  # The one verification lane. Keeps the historic job id `verify-hosted` for
  # branch-protection/status continuity even though there is no longer a second lane to be
  # "hosted" in contrast to.
  verify-hosted:
    needs: [classify]
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.docs-only != 'true' && needs.classify.outputs.redundant != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      # GitHub-hosted ubuntu-latest has ~7 GiB. 2560 was leftover from the
      # retired 3 GiB Coolify runner and OOMs Next 16 production builds
      # (exit 134, V8 Ineffective mark-compacts).
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run this job (it installs deps with a private-repo deploy key secret)."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Bot PRs cannot run package installs with this secret (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - name: Disable lingering sparse-checkout
        run: rm -rf ./* ./.git || true
      - uses: actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Split restore/save (2026-07-04, cache-hygiene): PR/merge_group runs only restore;
      # a new entry is saved only on main pushes and the nightly schedule so cache storage
      # stays a single rolling lineage per OS instead of one throwaway entry per PR push.
      # cleanup-caches.yml deletes stray PR-ref entries on PR close and prunes older
      # lineage entries daily.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-
            ${{ runner.os }}-nextjs-
      # The long-lived Linux runner has twice lost its checkout between the
      # initial checkout and npm install while another runner job was cleaning
      # a stale workspace. Re-checkout at the package-operation boundary so a
      # transient cleanup cannot turn into a false ENOENT failure.
      - name: Disable lingering sparse-checkout
        run: rm -rf ./* ./.git || true
      - name: Refresh checkout before package operations
        uses: actions/checkout@v7
      # verify-hosted only runs when docs-only is false (job-level `if` above), so per-step
      # docs-only guards are unnecessary here. Tokenless `npm ci` from the lockfile — the
      # shared dependency resolves over public HTTPS now (no deploy key).
      - name: Install dependencies
        run: npm ci --no-audit
      # The scheduled ios-ship cron has no `paths:` filter of its own, so
      # scripts/ios-scheduled-ship-gate.sh is the only thing keeping a
      # backend-only commit from becoming a TestFlight build (run 31723515355
      # shipped sha 39c6acee, a pure-backend alerts fix, before the gate
      # existed). It executes ONLY on the Mac ship runner, so a defect in it
      # would otherwise be invisible until testers were already being spammed.
      # These tests are fully offline: throwaway git repos in a scratch dir, no
      # network, no credentials, no xcodebuild, no App Store Connect.
      - name: iOS ship-gate scripts (bash)
        run: |
          bash -n scripts/ios-scheduled-ship-gate.sh
          bash -n scripts/test-ios-scheduled-ship-gate.sh
          bash -n scripts/ios-fleet-pin.sh
          bash -n scripts/ios-ship-testflight.sh
          bash -n scripts/ios-fleet/publish-ios-versions.sh
          bash scripts/test-ios-scheduled-ship-gate.sh
          node --test scripts/ios-fleet/publish-ios-versions.test.mjs
      # Deploy-freshness watchdog + shared-box OCR isolation are shell, so
      # vitest cannot cover them. Offline selftests (throwaway git + stub
      # /api/health, fake docker ps) catch a silent-pass the same way
      # verify-deploy-sha.selftest.sh does. No production, no Slack, no docker.
      - name: Deploy freshness + shared-box isolation scripts (bash)
        run: |
          bash -n scripts/verify-deploy-sha.sh
          bash -n scripts/verify-deploy-sha.selftest.sh
          bash -n scripts/alert-deploy-freshness.sh
          bash -n scripts/alert-deploy-freshness.selftest.sh
          bash -n scripts/isolate-shared-box-batch.sh
          bash -n scripts/isolate-shared-box-batch.selftest.sh
          bash scripts/verify-deploy-sha.selftest.sh
          bash scripts/alert-deploy-freshness.selftest.sh
          bash scripts/isolate-shared-box-batch.selftest.sh
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Save Next.js build cache (main push + nightly canary)
        # Only main pushes and the nightly schedule canary persist a new entry — PR/
        # merge_group runs restore from the latest main entry above but never write their own,
        # so cache storage stays one rolling lineage per OS. The schedule leg keeps the Linux
        # cache fresh during quiet stretches with no main pushes.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}-${{ hashFiles('src/**', 'app/**') }}

  verify-ios:
    needs: [classify]
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.docs-only != 'true' && needs.classify.outputs.redundant != 'true' }}
    uses: ./.github/workflows/ios-build.yml

  # THE required check. Pure gate: interprets the lanes above and reports under the exact
  # context name the ruleset requires. Fail-closed in every ambiguous state; annotates which
  # environment produced the accepted result (the audit receipt).
  verify:
    needs: [classify, verify-hosted, verify-ios]
    # `!cancelled()` (not `always()`) so superseded-run cancellation still cancels the gate,
    # while classify/lane failures cannot silently skip a required check (skipped required
    # checks can fail open — Codex review, PR #370).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Evaluate gate
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs-only }}
          REDUNDANT: ${{ needs.classify.outputs.redundant }}
          HOSTED_RESULT: ${{ needs.verify-hosted.result }}
          IOS_RESULT: ${{ needs.verify-ios.result }}
        run: |
          set -euo pipefail
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          note "### verify gate"
          note "- classify: ${CLASSIFY_RESULT} (docs-only: ${DOCS_ONLY:-n/a}, redundant: ${REDUNDANT:-n/a})"
          note "- verify-hosted (GitHub-hosted ubuntu-latest): ${HOSTED_RESULT}"
          note "- verify-ios (GitHub-hosted macos-latest): ${IOS_RESULT}"

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            note "- RESULT: FAIL — classify did not succeed; the gate never fails open."
            exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            note "- RESULT: PASS — docs-only diff — gate skipped by path filter."
            exit 0
          fi
          # Only the hourly backstop cron can set this, and only after confirming main
          # HEAD already carries a successful CI run. It is never reachable from a
          # pull_request / merge_group / push event, so it cannot short-circuit the
          # required check on a PR.
          if [ "$REDUNDANT" = "true" ]; then
            note "- RESULT: PASS — hourly backstop: main HEAD already has a green CI run; suite skipped."
            exit 0
          fi
          if [ "$HOSTED_RESULT" = "success" ] && [ "$IOS_RESULT" = "success" ]; then
            note "- RESULT: PASS — produced by GitHub-hosted ubuntu-latest and macos-latest."
            exit 0
          fi
          # Anything else — failure, skipped, or a state we did not enumerate — fails the
          # gate. A `skipped` verify-hosted on a non-docs-only diff used to be able to pass
          # via the (unreachable) self lane; there is no second lane now, so it is a FAIL.
          note "- RESULT: FAIL — the verification lane did not succeed (hosted: ${HOSTED_RESULT}, ios: ${IOS_RESULT})."
          exit 1
