# Standing watchdog for the 2026-08-06 silent deploy freeze: Coolify SSH exec
# streams died mid-build (exit 255) while GitHub webhooks returned 200 and
# /api/health stayed green on the old sha. Nobody noticed for ~14h.
#
# This workflow does NOT deploy, does NOT call the Coolify API, and does NOT
# post a deploy claim. It compares public /api/health .checks.release.sha to
# origin/main. A stale verdict (oldest undeployed commit >= 1h) fails the job
# so Sentry fleet-infra pages (sentry-ci-report.yml) and optionally posts
# #agent-sync when SLACK_BOT_TOKEN is set.
#
# Unreachable health is treated as OK here: UptimeRobot already pages site-down.
# This cron exists for the silent-green-on-old-sha class.
name: Deploy freshness

on:
  schedule:
    # Every 20 minutes, off the :00/:17/:30/:47 cluster used by other crons.
    - cron: "13,33,53 * * * *"
  workflow_dispatch: {}

concurrency:
  group: deploy-freshness
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: false

      - name: Previous freshness conclusion (Slack de-dupe)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          prev="$(gh api "repos/${REPO}/actions/workflows/deploy-freshness.yml/runs?per_page=10" \
            --jq "[.workflow_runs[]
                   | select((.id|tostring) != \"${THIS_RUN_ID}\")
                   | select(.status == \"completed\")
                   | .conclusion] | .[0] // \"none\"" 2>/dev/null || echo "none")"
          if ! printf '%s' "$prev" | grep -Eq '^(success|failure|cancelled|skipped|none)$'; then
            prev="none"
          fi
          echo "conclusion=${prev}" >> "$GITHUB_OUTPUT"
          echo "previous completed conclusion: ${prev}"

      - name: Check production release freshness
        env:
          DEPLOY_FRESHNESS_STALE_SECONDS: "3600"
          DEPLOY_FRESHNESS_NOTIFY: "1"
          DEPLOY_FRESHNESS_PREVIOUS_CONCLUSION: ${{ steps.prev.outputs.conclusion }}
          DEPLOY_FRESHNESS_TREAT_UNREACHABLE: "1"
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_AGENT_NAME: ST
          SLACK_TOPIC: Socratic-Trade
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/alert-deploy-freshness.sh
          bash scripts/alert-deploy-freshness.sh origin/main
