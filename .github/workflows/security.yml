name: Security

on:
  pull_request:
  # Required for the GitHub merge queue: the `gitleaks` check must run on the
  # queue's temporary merge_group branch, or queued PRs hang forever.
  merge_group:
  push:
    branches:
      - main
  # Cost note (2026-07-05): dropped the duplicate `agent/**` push trigger — agent
  # branches run `gitleaks` via their PR (`pull_request`) already. NOTE: gitleaks is
  # deliberately NOT given a docs-only fast path — a leaked secret in a *.md/docs file
  # is still a leak, so it must scan every diff including documentation.
  schedule:
    - cron: "41 10 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the same engine version CT migrated to after observing
  # gitleaks-action's POST-scan phase hang for ~6.5min under runner
  # contention (job summary / PR annotation writes).
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256_X64: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
  GITLEAKS_SHA256_ARM64: "5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run this job."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]'|'sentry[bot]'|'codex[bot]'|'chatgpt-codex-connector[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Bot PRs cannot run this job (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - uses: actions/checkout@v7
        with:
          # Gitleaks must see full history: a secret added and removed in an
          # earlier PR commit must remain scannable, as must scheduled history.
          fetch-depth: 0

      - name: Install pinned gitleaks
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="${TMPDIR:-/tmp}"; tmp_root="${tmp_root%/}"
          rm -f "$tmp_root/gitleaks.tmp"
          rm -rf "$tmp_root/gitleaks-${GITLEAKS_VERSION}"

          case "$(uname -m)" in
            x86_64|amd64)  arch="x64";   want="$GITLEAKS_SHA256_X64" ;;
            aarch64|arm64) arch="arm64"; want="$GITLEAKS_SHA256_ARM64" ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac

          tarball="$tmp_root/gitleaks.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz" \
            -o "$tarball"

          got="$(sha256sum "$tarball" | cut -d' ' -f1)"
          if [ "$got" != "$want" ]; then
            echo "::error::gitleaks checksum mismatch (expected $want, got $got)"
            exit 1
          fi

          mkdir -p "$tmp_root/gitleaks-${GITLEAKS_VERSION}"
          tar -xzf "$tarball" -C "$tmp_root/gitleaks-${GITLEAKS_VERSION}" gitleaks
          echo "$tmp_root/gitleaks-${GITLEAKS_VERSION}" >> "$GITHUB_PATH"

      - name: Scan for secrets
        timeout-minutes: 8
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.before }}
          PUSH_AFTER: ${{ github.after }}
        run: |
          set -euo pipefail
          gitleaks version

          # Preserve the action's scan SCOPE exactly.
          case "$EVENT" in
            pull_request)
              range="${PR_BASE}..${PR_HEAD}"
              ;;
            merge_group)
              # merge_queue commits aren't reachable on the PR branch head
              # at scan time. `github.event.pull_request.base.sha` is empty
              # in merge_group context, so we MUST source the base from
              # `merge_group.base_sha` — otherwise the constructed range
              # would be the invalid `"..<head>"`.
              base_sha="${MERGE_GROUP_BASE:-${PR_BASE:-}}"
              range="${base_sha}..${MERGE_GROUP_HEAD}"
              [ -n "${base_sha}" ] && [ -n "${MERGE_GROUP_HEAD:-}" ] || range=""
              ;;
            push)
              if [ -z "${PUSH_BEFORE:-}" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range=""
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            *)
              # schedule / manual: full history. This weekly sweep is what
              # catches anything a range scan structurally cannot see.
              range=""
              ;;
          esac

          # Findings go to a JSON report. `gitleaks git` only prints the
          # "leaks found: N" summary line, so a failing run used to say
          # *how many* leaks it found and nothing else.  --redact still
          # applies, and we print only structural fields (rule / path /
          # line / commit / fingerprint) and then delete the report, so
          # no secret value can reach a job log or an artifact even if
          # redaction ever regressed.
          report="${RUNNER_TEMP:-/tmp}/gitleaks-report.json"
          rm -f "$report"

          if [ -n "$range" ]; then
            echo "scanning commit range: $range"
            gitleaks git --no-banner --redact --exit-code 0 \
              --report-format json --report-path "$report" --log-opts "$range" .
          else
            echo "scanning full history"
            gitleaks git --no-banner --redact --exit-code 0 \
              --report-format json --report-path "$report" .
          fi

          count=0
          if [ -s "$report" ]; then
            count="$(jq 'length' "$report")"
          fi

          if [ "$count" -gt 0 ]; then
            echo "::error::gitleaks found ${count} finding(s).  Structural details below; secret values are never printed."
            # Explicitly whitelist the fields we emit.  Never emit .Secret or
            # .Match.
            jq -r '.[] | "  rule=\(.RuleID) file=\(.File) line=\(.StartLine) commit=\(.Commit[0:12]) date=\(.Date[0:10])\n    fingerprint=\(.Fingerprint)"' "$report"
            echo
            echo "A finding that is a confirmed false positive goes in .gitleaksignore as its"
            echo "fingerprint line, with a comment saying why.  A finding that is a real secret"
            echo "means ROTATE FIRST, then decide about history — never the other way round."
            rm -f "$report"
            exit 1
          fi

          rm -f "$report"
          echo "No leaks detected."
