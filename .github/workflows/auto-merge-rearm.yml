name: Auto-merge re-arm (AFC-812)

# Fires after an autofix lane completes, reads the PR number the lane
# handed over as an artifact, and re-fires the auto-merge classification
# with a label poke under an elevated credential (a GITHUB_TOKEN label
# add fires no `labeled` event, and the poke must happen only after the
# lane run has fully completed - both per Kody #5416).  The gate itself
# re-validates every rule before arming; this workflow only pokes it.

on:
  workflow_run:
    workflows: ["PR Autofix", "Claude Code Autofix", "Kody MiniMax M3.1 Flash Fix Proposals"]
    types: [completed]

permissions: {}

concurrency:
  group: auto-merge-rearm-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rearm:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Download the PR number from the settled lane run
        id: resolve
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: rearm-pr-number
          github-token: ${{ github.token }}
      - name: Poke the auto-merge gate via a label transition
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.SHEPHERD_TOKEN || '' }}
          PR_NUMBER_FILE: rearm-pr-number/rearm-pr-number.txt
          REPO: ${{ github.repository }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "no elevated credential configured; skipping re-arm"; exit 0; }
          [ -f "$PR_NUMBER_FILE" ] || { echo "no PR-number artifact from the lane run; skipping"; exit 0; }
          pr="$(tr -d '[:space:]' < "$PR_NUMBER_FILE")"
          case "$pr" in
            ''|*[!0-9]*) echo "no usable PR number in the artifact; skipping"; exit 0 ;;
          esac
          gh label create rearm-gate --repo "$REPO" --color D4C5F9 --description "Re-fires the auto-merge classification (AFC-812)" 2>/dev/null || true
          # Remove-then-add so the labeled event fires on every settle, not
          # just the first round.
          gh pr edit "$pr" --repo "$REPO" --remove-label rearm-gate 2>/dev/null || true
          gh pr edit "$pr" --repo "$REPO" --add-label rearm-gate
          echo "re-armed the gate for PR #$pr"
