name: Auto-merge re-arm (AFC-812)

# Fires after an autofix lane completes, reads the PR number the lane
# handed over as an artifact, and re-fires the auto-merge classification
# with a label poke under an elevated credential (a GITHUB_TOKEN label
# add fires no `labeled` event, and the poke must happen only after the
# lane run has fully completed - both per Kody #5416).  The gate itself
# re-validates every rule before arming; this workflow only pokes it.

on:
  workflow_run:
    workflows: ["PR Autofix", "Claude Code Autofix", "Kody MiniMax M3.1 Flash Fix Proposals"]
    types: [completed]

permissions: {}

concurrency:
  group: auto-merge-rearm-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rearm:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Download the PR number from the settled lane run
        id: resolve
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: rearm-pr-number
          github-token: ${{ github.token }}
      - name: Poke the auto-merge gate via a label transition
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.SHEPHERD_TOKEN || '' }}
          PR_NUMBER_FILE: rearm-pr-number/rearm-pr-number.txt
          REPO: ${{ github.repository }}
        run: |
          [ -f "$PR_NUMBER_FILE" ] || { echo "no PR-number artifact from the lane run; skipping"; exit 0; }
          pr="$(tr -d '[:space:]' < "$PR_NUMBER_FILE")"
          case "$pr" in
            ''|*[!0-9]*) echo "no usable PR number in the artifact; skipping"; exit 0 ;;
          esac
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN is empty: configure secrets.GH_PAT or secrets.SHEPHERD_TOKEN so the re-arm can fire"
            exit 1
          fi
          probe_err="$RUNNER_TEMP/rearm-probe-err.txt"
          if ! login="$(gh api graphql -f query='query { viewer { login } }' --jq '.data.viewer.login' 2>"$probe_err")"; then
            # Distinguish a rejected token from a transient GitHub failure.
            if grep -q 'Bad credentials\|HTTP 401' "$probe_err" 2>/dev/null; then
              echo "::error::GH_TOKEN rejected by GitHub (revoked or expired); re-arm cannot fire"
            else
              echo "::error::GH_TOKEN probe failed (transient GitHub error; retry the lane or the re-arm later): $(head -c 200 "$probe_err")"
            fi
            exit 1
          fi
          perm_err="$RUNNER_TEMP/rearm-perm-err.txt"
          if ! perm="$(gh api "repos/$REPO/collaborators/$login/permission" --jq '.permission' 2>"$perm_err")"; then
            # A failed probe is not proof of denial: separate transient
            # GitHub errors from a genuine access boundary.
            if grep -qi 'rate limit' "$perm_err" 2>/dev/null; then
              echo "::error::permission probe hit a GitHub rate limit (retry the lane or the re-arm later)"
            elif grep -q 'HTTP 403\|HTTP 404' "$perm_err" 2>/dev/null; then
              echo "::error::GH_TOKEN (login $login) cannot read collaborator permissions on $REPO (403/404); grant the token repository access"
            else
              echo "::error::permission probe failed (transient GitHub error; retry the lane or the re-arm later): $(head -c 200 "$perm_err")"
            fi
            exit 1
          fi
          case "$perm" in
            # triage and maintain can both manage labels.
            admin|write|maintain|triage) : ;;
            *) echo "::error::GH_TOKEN (login $login) lacks write access to $REPO (permission: $perm)"; exit 1 ;;
          esac
          gh label create rearm-gate --repo "$REPO" --color D4C5F9 --description "Re-fires the auto-merge classification (AFC-812)" 2>/dev/null || true
          # Remove-then-add so the labeled event fires on every settle, not
          # just the first round.
          gh pr edit "$pr" --repo "$REPO" --remove-label rearm-gate 2>/dev/null || true
          gh pr edit "$pr" --repo "$REPO" --add-label rearm-gate
          echo "re-armed the gate for PR #$pr"
