name: SocraticTrade
options:
  bundleIdPrefix: trade.socratic
  deploymentTarget:
    iOS: "16.0"
targets:
  SocraticTrade:
    type: application
    platform: iOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: trade.socratic.app
      CODE_SIGN_ENTITLEMENTS: SocraticTrade/SocraticTrade.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: SocraticTrade/SocraticTrade.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: SocraticTrade/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
          - remote-notification
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - socratictrade
            CFBundleURLName: "trade.socratic.app"
    sources: [SocraticTrade]
