# Project Format: Xcode 26.3-compatible (objectVersion / preferredProjectObjectVersion = 100).
# XcodeGen 2.46 still emits objectVersion 77 for xcodeVersion 26.3; after `xcodegen generate`
# re-apply objectVersion=100 and preferredProjectObjectVersion=100 in project.pbxproj
# (matches Congress.Trade + Usage-Monitor). Do not leave 77 (UI shows Xcode 16).

name: Socratic Trade

options:
  bundleIdPrefix: trade.socratic
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
  xcodeVersion: "26.3"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    INFOPLIST_KEY_CFBundleDisplayName: "Socratic Trade"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"

targets:
  SocraticTrade:
    type: application
    platform: iOS
    sources:
      - path: SocraticTrade
        excludes:
          - README.md
          - Info.plist
          - SocraticTrade.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: trade.socratic.app
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SocraticTrade/SocraticTrade.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: "Socratic Trade"
        # PRODUCT_NAME has a space, which sanitizes to module "Socratic_Trade" —
        # that broke `@testable import SocraticTrade` in the test target (which,
        # combined with the TEST_HOST mismatch, means the tests were never
        # runnable).  Pin the module name so imports and the display name are
        # decoupled.
        PRODUCT_MODULE_NAME: SocraticTrade
    info:
      path: SocraticTrade/Info.plist
      properties:
        # Version fields MUST stay build-variable substitutions.  Without these two
        # entries xcodegen emits literal "1.0"/"1" defaults on every `xcodegen
        # generate`, silently detaching the shipped version from MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION above — that is exactly how the 2026-08-11 version
        # regression (fixed in PR #2639) got introduced by an unrelated regen.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Socratic Trade
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: trade.socratic.app
            CFBundleURLSchemes:
              - socratictrade
    entitlements:
      path: SocraticTrade/SocraticTrade.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Universal links.  The domain side is app/.well-known/apple-app-site-association/
        # route.ts (served without a .json extension, appID CC8UTF7ATG.trade.socratic.app).
        # Keep this list and SocraticTrade.entitlements in sync — xcodegen REWRITES that file
        # from these properties, so an entry only added there is lost on the next regen.
        com.apple.developer.associated-domains:
          - applinks:socratictrade.com

  SocraticTradeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SocraticTradeTests
    dependencies:
      - target: SocraticTrade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: trade.socratic.app.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        # The app target overrides PRODUCT_NAME to "Socratic Trade" (with a space);
        # xcodegen derives TEST_HOST from the target NAME (SocraticTrade), which
        # points at a bundle that does not exist — the test target could never run
        # until these two overrides.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Socratic Trade.app/Socratic Trade"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SocraticTrade:
    build:
      targets:
        SocraticTrade: all
        SocraticTradeTests: [test]
    test:
      targets:
        - SocraticTradeTests
