name: SocraticTrade
options:
  bundleIdPrefix: com.jaywedgeworth
  developmentLanguage: en
targets:
  SocraticTrade:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SocraticTrade
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # Set this in Xcode to Jay Wedgeworth, LLC
        PRODUCT_BUNDLE_IDENTIFIER: com.jaywedgeworth.SocraticTrade
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
